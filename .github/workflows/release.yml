name: release

on:
  workflow_run:
    workflows: [security-ci]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - id: release-commit
        run: |
          if git log -1 --pretty=%s | grep -Eq '^Release ChenDoc v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - id: version
        if: steps.release-commit.outputs.enabled == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - id: existing
        if: steps.release-commit.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Cloudflare, backend, and server deployments
        if: steps.existing.outputs.found == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
          BACKEND_ORIGIN: ${{ vars.CHENDOC_BACKEND_ORIGIN || 'https://api.w92.pw' }}
          PUBLIC_ORIGIN: ${{ vars.CHENDOC_PUBLIC_ORIGIN || 'https://d.w92.pw' }}
        run: |
          npm ci --workspaces --include-workspace-root
          node scripts/release.js --backend-origin="$BACKEND_ORIGIN" --public-origin="$PUBLIC_ORIGIN"
          unzip -Z1 "release/chendoc-$VERSION-cloudflare-pages.zip" | grep -qx 'index.html'
          unzip -Z1 "release/chendoc-$VERSION-backend.zip" | grep -qx 'deploy-backend.sh'
          unzip -Z1 "release/chendoc-$VERSION-server.zip" | grep -qx 'deploy.sh'
          rm -rf release/backend-verify
          mkdir -p release/backend-verify
          unzip -q "release/chendoc-$VERSION-backend.zip" -d release/backend-verify
          (
            cd release/backend-verify
            npm ci --dry-run --ignore-scripts --workspace @chendoc/server
          )
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.VERSION;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const marker = `### ${version}`;
          const start = changelog.indexOf(marker);
          if (start < 0) throw new Error(`Missing changelog section: ${version}`);
          const rest = changelog.slice(start + marker.length);
          const end = rest.search(/\n###\s/);
          const body = (end < 0 ? rest : rest.slice(0, end)).trim();
          writeFileSync('release/release-notes.md', `# ChenDoc v${version}\n\n${body}\n`);
          NODE

      - name: Publish GitHub Release
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh release create "$TAG"
          "release/chendoc-$VERSION-cloudflare-pages.zip"
          "release/chendoc-$VERSION-backend.zip"
          "release/chendoc-$VERSION-server.zip"
          "release/chendoc-$VERSION-SHA256SUMS.txt"
          --target "$TARGET"
          --title "ChenDoc v$VERSION"
          --notes-file release/release-notes.md
